name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML (docker-compose.yml, workflow files)
        run: |
          python -c "import yaml, glob
          for f in ['docker-compose.yml'] + glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print(f, 'OK')"

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  build-and-validate-compose:
    name: Build Docker images & validate compose config
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Validate docker compose configuration
        run: docker compose config

      - name: Build all images
        run: docker compose build

  integration-test:
    name: Integration test (full stack)
    runs-on: ubuntu-latest
    needs: build-and-validate-compose
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Start the platform
        run: docker compose up -d --build

      - name: Run end-to-end pipeline smoke test
        run: python scripts/run_pipeline_test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
