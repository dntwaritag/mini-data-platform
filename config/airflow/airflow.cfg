# Mini Data Platform — Airflow configuration notes
#
# Most Airflow settings are supplied via environment variables in
# docker-compose.yml (the AIRFLOW__SECTION__KEY convention), which take
# precedence over this file and over airflow's own defaults. This file
# documents the key values actually in effect so they don't only live
# inside the compose file.
#
# [core]
# executor = LocalExecutor
# load_examples = False
# dags_are_paused_at_creation = True   # new DAGs must be enabled explicitly
#
# [database]
# sql_alchemy_conn = postgresql+psycopg2://airflow:***@airflow-metadata-db:5432/airflow
#
# [webserver]
# expose_config = False
#
# If you need to override additional settings, prefer adding an
# AIRFLOW__SECTION__KEY environment variable to docker-compose.yml rather
# than editing this file, to keep configuration in one place.
